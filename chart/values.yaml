#  LOG_OUTPUT: "stdout"               # 日志输出：stdout, file, both；默认 stdout
#  LOG_FILE: "logs/exporter.log"      # 日志文件路径；默认 logs/exporter.log
#  LOG_MAX_SIZE: "100"                # 日志文件最大大小（MB）；默认 100
#  LOG_MAX_BACKUPS: "3"               # 日志文件最大备份数；默认 3
#  LOG_MAX_AGE: "28"                  # 日志文件最大保留天数；默认 28
#  LOG_COMPRESS: "true"               # 是否压缩日志文件；默认 true
#  
#  # 采集配置
#  DISCOVERY_TTL: "1d"                # 资源发现缓存生命周期；支持 s/m/h/d；默认 1d
#  SCRAPE_INTERVAL: "60s"             # 采集间隔；支持 "60s", "1m" 等；默认 60s
#  PERIOD_FALLBACK: "60"              # Period Fallback 值（秒）；当无法从元数据获取 Period 时的默认值；默认 60
#
#  # 首次采集策略（智能错峰）- 对应 firstRun 配置组
#  FIRST_RUN_STRATEGY: "auto"         # 首次采集策略：auto（自动）| immediate（立即）| staggered（强制错峰）；默认 auto
#                                      # - auto: 单/双Pod立即采集，3-10个Pod线性延迟，>10个Pod指数退避延迟
#                                      # - immediate: 强制所有Pod立即采集（适合小规模或云API限流宽松的场景）
#                                      # - staggered: 强制线性延迟，均匀分布（适合对云API限流极度敏感的场景）
#  FIRST_RUN_MAX_DELAY: "180"         # 首次采集最大延迟秒数（默认180秒）；仅在 strategy=staggered 或大规模场景生效
#                                      # 示例：20个Pod，maxDelay=180s，Pod-0立即，Pod-19延迟约170秒
#  
#  # 并发配置
#  REGION_CONCURRENCY: "4"            # 区域级并发：同一账号下并行采集的地域数量（建议 1-8）；默认 4
#  PRODUCT_CONCURRENCY: "2"           # 产品级并发：同一地域下并行处理的命名空间数量（建议 1-4）；默认 2
#  METRIC_CONCURRENCY: "5"            # 指标级并发：同一地域、同一产品下并行处理的指标批次（建议 1-10）；默认 5
#
#  # 智能区域发现配置 - 对应 regionDiscovery 配置组
#  REGION_DISCOVERY_ENABLED: "true"         # 是否启用智能区域发现；默认 true
#  REGION_DISCOVERY_INTERVAL: "1h"          # 重新发现周期；支持 s/m/h/d；默认 1h（从 24h 改为 1h）
#  REGION_EMPTY_THRESHOLD: "3"              # 连续空次数阈值；默认 3
#
#  # 华为云缓存配置 - 对应 huaweiCache 配置组
#  HUAWEI_CACHE_ENABLED: "true"       # 是否启用华为云缓存；默认 true
#  HUAWEI_CACHE_RESOURCE_TTL: "10m"   # 资源缓存 TTL；默认 10 分钟
#  HUAWEI_CACHE_TAG_TTL: "30m"        # 标签缓存 TTL；默认 30 分钟
#
#  # 集群稳定性检测配置 - 对应 cluster.stabilityCheck 配置组
#  CLUSTER_STABILITY_CHECK_ENABLED: "true"    # 是否启用稳定性检测；默认 true
#  CLUSTER_STABILITY_MAX_WAIT: "30s"          # 最长等待时间；默认 30s
#  CLUSTER_STABILITY_CHECK_INTERVAL: "2s"     # 检查间隔；默认 2s
#  CLUSTER_STABILITY_REQUIRED_STABLE: "3"     # 需要连续稳定的次数；默认 3
#
#  # 安全配置
#  ADMIN_AUTH_ENABLED: "false"        # 是否启用管理接口认证；默认 false

security:
  adminSecretName: ""

accounts:
  # 分组式账号（推荐）：按云平台拆分，模板将生成 grouped 结构的 accounts.yaml
  grouped:
    aliyun: []
    #   - name: aliyun-acc-0
    #     regions: ["*"]
    #     resources: ["bwp", "clb", "s3", "alb", "nlb", "gwlb"]
    tencent: []
    #   - name: tencent-acc-0
    #     regions: ["*"]
    #     resources: ["clb", "bwp", "s3"]
    huawei: []
    #   - name: huawei-acc-0
    #     regions: ["*"]
    #     resources: ["bwp"]
    aws: []
    #   - name: aws-acc-0
    #     AWS 的 S3 采集使用全局接口（ListBuckets），regions 可留空或使用 ["*"]
    #     regions: ["*"]
    #     resources: ["s3"]

resources: {}

nodeSelector: {}

tolerations: []

affinity: {}

topologySpreadConstraints: []
  # - maxSkew: 1
  #   topologyKey: topology.kubernetes.io/zone
  #   whenUnsatisfiable: DoNotSchedule
  #   labelSelector:
  #     matchLabels:
  #       app.kubernetes.io/name: multicloud-exporter

priorityClassName: "system-cluster-critical"

reloader:
  enabled: true
  useAuto: false
