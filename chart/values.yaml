fullname: multicloud-exporter
replicaCount: 1

image:
  registry: 
  repository: 
  tag: 
  pullPolicy: IfNotPresent

service:
  port: 9101
  type: ClusterIP
  nodePort:
  annotations:

headless:
  enabled: false
  name: ""

serviceMonitor:
  enabled: false
  labels: {}
  scheme: http
  interval: "60s"
  scrapeTimeout: "30s"
  metricRelabelings: []
  relabelings:
    # 排除 Headless Service，避免重复采集指标
    # 当同时存在标准 Service 和 Headless Service（如 multicloud-exporter 和 multicloud-exporter-headless）时
    # VMServiceScrape 会从两个 Service 采集数据，导致指标重复
    # 使用以下 relabeling 配置仅保留标准 Service：
    - action: keep
      sourceLabels: ["__meta_kubernetes_service_name"]
      regex: "multicloud-exporter"

hpa:
  enabled: false
  minReplicas: 1
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70

probes:
  liveness:
    enabled: true
    path: /healthz
    initialDelaySeconds: 20
    periodSeconds: 10
    timeoutSeconds: 2
    failureThreshold: 3
  readiness:
    enabled: true
    path: /metrics
    initialDelaySeconds: 10
    periodSeconds: 10
    timeoutSeconds: 2
    failureThreshold: 3

cluster:
  discovery: "" # values: headless|file|""
  svcName: ""   # required when discovery=headless
  file: ""      # required when discovery=file
  
  # Static sharding configuration (alternative to discovery)
  # When running in static mode (discovery=""), you can manually assign shards.
  # This maps to EXPORT_SHARD_TOTAL and EXPORT_SHARD_INDEX env vars.
  sharding:
    enabled: false
    total: 1
    index: 0
  
  # 集群稳定性检测配置（用于多副本场景）
  # 在滚动更新时，等待集群拓扑稳定后再开始采集，避免重复采集
  stabilityCheck:
    enabled: true          # 是否启用稳定性检测；默认 true
    maxWait: 30s           # 最长等待时间；默认 30s
    checkInterval: 2s      # 检查间隔；默认 2s
    requiredStable: 3      # 需要连续稳定的次数；默认 3

# 首次采集策略配置（智能错峰）
# 控制多个 Pod 启动时的首次采集时机，避免同时向云厂商 API 发起大量请求导致限流
firstRun:
  strategy: auto         # 首次采集策略：auto（自动）| immediate（立即）| staggered（强制错峰）；默认 auto
                          # - auto: 单 Pod 立即采集，2-10 个 Pod 线性延迟，>10 个 Pod 指数退避延迟
                          # - immediate: 强制所有 Pod 立即采集（适合小规模或云 API 限流宽松的场景）
                          # - staggered: 强制线性延迟，均匀分布（适合对云 API 限流极度敏感的场景）
  maxDelay: 180          # 首次采集最大延迟秒数；默认 180 秒
                          # 示例：20 个 Pod，maxDelay=180s，Pod-0 立即，Pod-19 延迟约 170 秒

# 区域发现配置（智能区域选择）
# 自动识别有资源的区域并优先采集，跳过连续多次无资源的区域
regionDiscovery:
  enabled: true                # 是否启用智能区域发现；默认 true
  discoveryInterval: 1h        # 重新发现周期；支持 s/m/h/d；默认 1h（从 24h 改为 1h）
  emptyThreshold: 30           # 连续空次数阈值；默认 30

# 华为云缓存配置（限流优化）
# 针对华为云的严格限流策略，通过缓存减少 API 调用次数
huaweiCache:
  enabled: true          # 是否启用华为云缓存；默认 true
  resourceTTL: 10m       # 资源缓存 TTL；默认 10 分钟
  tagTTL: 30m            # 标签缓存 TTL；默认 30 分钟

# Server 配置（可选）：警告！仅供高级用户使用
# 警告：如果设置此字段，将创建 ConfigMap 并完全覆盖容器内的 /app/configs/server.yaml
# 这将导致默认的环境变量映射失效，除非你在自定义配置中手动重新包含它们
server: {}

# 环境变量覆盖（按需）：如果设置将覆盖 server.yaml 中的对应配置
# 所有环境变量都会传递给容器，支持覆盖 server.yaml 中的配置
# 
# 默认值参考：
# - 监听端口: 9101
# - 采集间隔: 60s
# - 发现缓存 TTL: 30m
# - 并发度: Region=4, Product=1, Metric=2
# - 四维并发: Mode=auto, Max=20
env: {}
#  # 服务配置示例
#  EXPORTER_PORT: "9101"
#  LOG_LEVEL: "info"
#  
#  # 采集配置示例
#  SCRAPE_INTERVAL: "60s"
#  DISCOVERY_TTL: "30m"               # 资源发现缓存生命周期；默认 30m
#  REGION_CONCURRENCY: "4"            # 区域级并发；默认 4
#  PRODUCT_CONCURRENCY: "1"           # 产品级并发；默认 1
#  METRIC_CONCURRENCY: "2"            # 指标级并发；默认 2
#
#  # 四维架构配置（v0.5.0+）
#  FOUR_DIMENSION_CONCURRENCY_MODE: "auto"      # 并发模式：auto|conservative|standard|aggressive
#  FOUR_DIMENSION_MAX_CONCURRENCY: "20"         # 总并发度限制：避免触发云 API 限流，建议范围 1-20
#  FOUR_DIMENSION_PERFORMANCE_TUNING: "true"    # 性能优化开关：启用后会自动计算最优并发度

security:
  adminSecretName: ""

accounts:
  # 分组式账号（推荐）：按云平台拆分，模板将生成 grouped 结构的 accounts.yaml
  grouped:
    aliyun: []
    #   - name: aliyun-acc-0
    #     regions: ["*"]
    #     resources: ["bwp", "clb", "s3", "alb", "nlb", "gwlb"]
    tencent: []
    #   - name: tencent-acc-0
    #     regions: ["*"]
    #     resources: ["clb", "bwp", "s3"]
    huawei: []
    #   - name: huawei-acc-0
    #     regions: ["*"]
    #     resources: ["bwp"]
    aws: []
    #   - name: aws-acc-0
    #     AWS 的 S3 采集使用全局接口（ListBuckets），regions 可留空或使用 ["*"]
    #     regions: ["*"]
    #     resources: ["s3"]

resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 100m
    memory: 128Mi

serviceAccount:
  create: true
  name: ""
  annotations: {}

securityContext:
  runAsUser: 1000
  runAsGroup: 3000
  fsGroup: 2000

containerSecurityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  capabilities:
    drop: ["ALL"]

networkPolicy:
  enabled: false
  allowMonitoring: true

nodeSelector: {}

tolerations: []

affinity: {}

topologySpreadConstraints: []
  # - maxSkew: 1
  #   topologyKey: topology.kubernetes.io/zone
  #   whenUnsatisfiable: DoNotSchedule
  #   labelSelector:
  #     matchLabels:
  #       app.kubernetes.io/name: multicloud-exporter

priorityClassName: "system-cluster-critical"

reloader:
  enabled: true
  useAuto: false
