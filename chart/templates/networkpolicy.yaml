{{- if .Values.networkPolicy.enabled }}
kind: NetworkPolicy
apiVersion: networking.k8s.io/v1
metadata:
  name: {{ include "multicloud-exporter.fullname" . }}
  labels:
    {{- include "multicloud-exporter.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "multicloud-exporter.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    - ports:
        - port: {{ .Values.service.port }}
          protocol: TCP
      {{- if .Values.networkPolicy.allowMonitoring }}
      from:
        - namespaceSelector: {}
          podSelector:
            matchLabels:
              # 默认允许 Prometheus Operator 的抓取
              app.kubernetes.io/name: prometheus
      {{- end }}
{{- end }}
