{{- if or (and .Values.server .Values.server.regionDiscovery .Values.server.regionDiscovery.enabled) .Values.regionDiscovery.enabled }}
{{- if .Values.regionData.persistence.enabled }}
{{- if not .Values.regionData.persistence.existingClaim }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ printf "%s-region-data" (default "multicloud-exporter" .Values.fullname) }}
  labels: {{- include "multicloud-exporter.labels" . | nindent 4 }}
spec:
  accessModes:
    - {{ .Values.regionData.persistence.accessMode | default "ReadWriteOnce" }}
  resources:
    requests:
      storage: {{ .Values.regionData.persistence.size | default "1Gi" }}
{{- if .Values.regionData.persistence.storageClass }}
  storageClassName: {{ .Values.regionData.persistence.storageClass }}
{{- end }}
{{- end }}
{{- end }}
{{- end }}


